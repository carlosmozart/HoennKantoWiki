name: Android debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/android/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v6
      - run: npm ci
        working-directory: apps/android
      - name: Build debug APK
        run: python3 -B tools/build_apk.py
        working-directory: apps/android
      - uses: actions/upload-artifact@v7
        with:
          name: HoennKantoWiki-debug
          path: |
            apps/android/dist/*.apk
            apps/android/dist/*.sha256
          if-no-files-found: error
          retention-days: 14
